name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    # Both platforms, because the point of the backend split is that neither runtime is
    # importable on the other's machine: macos-14 installs laya-mlx, ubuntu installs laya.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv venv --python 3.13
      - run: uv pip install -e '.[dev]'
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
      - name: the platform picked the backend it can actually run
        run: uv run python -c "import layad.backends as b, importlib; importlib.import_module({'mlx': 'laya_mlx', 'torch': 'laya'}[b.default_backend()])"

  model:
    # Private macOS runners bill at 10x, so the ~800 MiB checkpoint download stays off
    # every pull request. It runs on pushes to main instead.
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            backend: mlx
          - os: ubuntu-latest
            backend: torch
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-${{ matrix.backend }}-laya-typed-decisions
      - run: uv venv --python 3.13
      - run: uv pip install -e '.[dev]'
      - env:
          LAYAD_TEST_MODEL: "1"
          # The model tests assert wire shape and determinism, never a score: the two
          # backends agree closely but not exactly, so a pinned number would be flaky.
          LAYAD_BACKEND: ${{ matrix.backend }}
        run: uv run pytest -q -m model
