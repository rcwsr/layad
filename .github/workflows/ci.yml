name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    # arm64: mlx only publishes macosx_*_arm64 wheels and needs Metal.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv venv --python 3.13
      - run: uv pip install -e '.[dev]'
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q

  model:
    # Private macOS runners bill at 10x, so the ~800 MiB checkpoint download stays off
    # every pull request. It runs on pushes to main instead.
    if: github.event_name != 'pull_request'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-laya-typed-decisions-mlx
      - run: uv venv --python 3.13
      - run: uv pip install -e '.[dev]'
      - env:
          LAYAD_TEST_MODEL: "1"
        run: uv run pytest -q -m model
