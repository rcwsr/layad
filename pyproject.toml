[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "layad"
version = "0.1.0"
description = "Local daemon that keeps the Laya decision model resident and serves it over HTTP"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Robin Cawser", email = "robin@cwsr.dev" }]
keywords = ["laya", "mlx", "apple-silicon", "inference", "daemon"]
classifiers = [
  "Environment :: MacOS X",
  "Operating System :: MacOS :: MacOS X",
  "Programming Language :: Python :: 3.11",
]
dependencies = [
  # Pinned to the 0.2 line: layad reads laya_mlx.common.serialize_state and
  # agent.cfg/agent.prepare to detect truncation exactly (see engine.truncated_questions).
  "laya-mlx>=0.2,<0.3",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "typer>=0.12",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.12"]

[project.scripts]
layad = "layad.cli:main"

[project.urls]
Homepage = "https://github.com/rcwsr/layad"

[tool.hatch.build.targets.wheel]
packages = ["src/layad"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
markers = ["model: requires the Laya checkpoint (~800 MiB download)"]
testpaths = ["tests"]
